# 导图仓库推送 / 手动 / 生成器代码变更 → 生成站点 → 同时部署 Pages 与自建服务器
#
# 所需 Secrets（本仓库 BlogSystemFromMindMap → Settings → Secrets → Actions）：
#   GH_PAT          必填（导图库为私有）。能读 yixiaozi/YixiaoziDocearLibrary
#                   Fine-grained: 含该仓库 + Contents Read（或 Read and write）
#                   可与导图库的 BLOG_DISPATCH_TOKEN 用同一 PAT
#   SSH_HOST        自建站主机
#   SSH_USER        SSH 用户名
#   SSH_PRIVATE_KEY SSH 私钥
#
# 可选 Variables：
#   SITE_BASE_URL   RSS 等绝对链接根地址（默认 GitHub Pages 地址）
#   MINDMAP_REPO    导图仓库 full name（默认 yixiaozi/YixiaoziDocearLibrary）
#   MINDMAP_REF     导图分支（默认 master）
#
# 导图库：浅层元数据全历史（提交记录）+ sparse 仅 .mm + blob:none；
# 文章实际引用的图片在生成器里按需 git checkout（不必下载全库图片）

name: Generate and Deploy

on:
  repository_dispatch:
    types: [mindmap-updated]
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "MindmapBlog/**"
      - ".github/workflows/generate-and-deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: generate-and-deploy
  cancel-in-progress: true

env:
  MINDMAP_PATH: mindmaps
  DIST_PATH: dist
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout blog generator (保留已有 dist 以延续版本历史)
        uses: actions/checkout@v4

      # 私有导图库不能用默认 GITHUB_TOKEN（只能访问本仓库），必须用 GH_PAT
      - name: Require GH_PAT for private mindmap repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::导图库 YixiaoziDocearLibrary 为私有仓库。"
            echo "::error::请在本仓库 BlogSystemFromMindMap → Settings → Secrets and variables → Actions"
            echo "::error::添加 Secret：GH_PAT = 能读取该私有库的 PAT（Contents: Read）。"
            echo "::error::可与导图库里的 BLOG_DISPATCH_TOKEN 使用同一个 Fine-grained Token。"
            exit 1
          fi

      - name: Checkout mindmap library (full history, mm-only sparse, blob:none)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.MINDMAP_REPO || 'yixiaozi/YixiaoziDocearLibrary' }}
          ref: ${{ vars.MINDMAP_REF || 'master' }}
          path: ${{ env.MINDMAP_PATH }}
          # 0 = 完整提交历史（提交记录页需要）；blob:none = 不预拉文件内容
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.GH_PAT }}
          # 工作区只落盘 .mm；图片由生成器按文章引用再 git checkout
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            **/*.mm

      - name: Show mindmap checkout size
        run: |
          echo "Mindmap path: ${{ env.MINDMAP_PATH }} (sparse: mm only; images on demand)"
          du -sh "${{ env.MINDMAP_PATH }}" || true
          echo "mm:     $(find "${{ env.MINDMAP_PATH }}" -name '*.mm' | wc -l | tr -d ' ')"
          echo "images: $(find "${{ env.MINDMAP_PATH }}" \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' -o -iname '*.webp' -o -iname '*.avif' -o -iname '*.svg' -o -iname '*.bmp' \) | wc -l | tr -d ' ')"
          echo "commits:$(git -C "${{ env.MINDMAP_PATH }}" rev-list --count HEAD 2>/dev/null || echo '?')"
          SIZE_MB=$(du -sm "${{ env.MINDMAP_PATH }}" | awk '{print $1}')
          echo "size_mb=$SIZE_MB"
          if [ "$SIZE_MB" -gt 800 ]; then
            echo "::warning::仅 .mm 稀疏检出仍较大，请检查是否误拉了二进制文件"
          fi

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Generate site
        run: |
          BASE_URL="${{ vars.SITE_BASE_URL }}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="https://yixiaozi.github.io/BlogSystemFromMindMap"
          fi
          echo "SITE_BASE_URL=$BASE_URL"
          dotnet run --project MindmapBlog -- \
            --scan "${{ env.MINDMAP_PATH }}" \
            --out "${{ env.DIST_PATH }}" \
            --base-url "$BASE_URL"

      - name: Ensure dist looks valid
        run: |
          test -f "${{ env.DIST_PATH }}/index.html"
          test -f "${{ env.DIST_PATH }}/site.css"
          ls -la "${{ env.DIST_PATH }}" | head -30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DIST_PATH }}

      - name: Upload dist for server deploy
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: ${{ env.DIST_PATH }}
          retention-days: 3

  deploy-pages:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-server:
    needs: generate
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Skip notice when SSH not configured
        if: env.SSH_HOST == '' || env.SSH_USER == '' || env.SSH_PRIVATE_KEY == ''
        run: echo "SSH_HOST / SSH_USER / SSH_PRIVATE_KEY 未配置，跳过自建站部署。"

      - name: Download dist
        if: env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_PRIVATE_KEY != ''
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Deploy to server via rsync
        if: env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_PRIVATE_KEY != ''
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: dist/
          remote_path: /var/www/mantoublog/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
