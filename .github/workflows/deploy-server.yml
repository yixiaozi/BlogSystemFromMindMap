name: Deploy Dist To Server

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure dist exists
        run: |
          if [ ! -d "dist" ]; then
            echo "dist directory not found in repository."
            echo "Please generate locally and commit dist before pushing."
            exit 1
          fi

      - name: Deploy to server via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: dist/
          remote_path: /var/www/mantoublog/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
